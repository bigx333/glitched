name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go tool mygo vet .

  test:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # mygo lays out text with Pango, loaded at run time. Without it the
      # root package's UI tests click on a fallback layout and fail.
      - name: Install Pango
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpangocairo-1.0-0
      # Skipped until daemon.Start stops taking tailnet.Detect's deadline
      # for an installed Tailscale (internal/daemon/daemon.go:159-160);
      # on a runner without Tailscale its outcome is a race.
      - run: go test -timeout 20m -skip '^TestServeUploadsToARemoteHubWithAToken$' ./...

  race:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -timeout 10m ./internal/client ./internal/daemon ./internal/transport
