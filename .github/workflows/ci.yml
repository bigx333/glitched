name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # With cgo off, so vet also proves every package builds without it.
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go tool mygo vet .

  # The root package's UI tests take most of the run, so each of three
  # runners takes every third of them; the first also tests the rest.
  # 40 minutes: part 1 took about 23 on the self-hosted runners, and
  # Install Pango may wait up to 11 if another apt run holds its locks.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # mygo lays out text with Pango, loaded at run time. Without it the
      # root package's UI tests click on a fallback layout and fail. If the
      # runner's image already has it, the step installs nothing. Should
      # another apt run hold the locks as the job starts, install waits for
      # dpkg's (DPkg::Lock::Timeout), and update, which that option doesn't
      # cover, tries again until the same 10 minutes are up.
      - name: Install Pango
        timeout-minutes: 11
        run: |
          if dpkg-query -W -f='${Status}' libpangocairo-1.0-0 2>/dev/null | grep -qx 'install ok installed'; then
            echo "Pango is already installed"
            exit 0
          fi
          apt="sudo apt-get -q -o DPkg::Lock::Timeout=600"
          until $apt update; do
            if [ $SECONDS -ge 600 ]; then exit 1; fi
            sleep 10
          done
          $apt install -y --no-install-recommends libpangocairo-1.0-0
      - name: Test part ${{ matrix.part }} of the root package
        run: |
          set -o pipefail
          tests=$(go test -list . . | grep '^Test' | awk -v i=${{ strategy.job-index }} -v n=${{ strategy.job-total }} '(NR - 1) % n == i' | paste -sd'|')
          test -n "$tests"
          go test -timeout 30m -run "^($tests)\$" .
      - name: Test the other packages
        if: ${{ !cancelled() && strategy.job-index == 0 }}
        run: go test -timeout 20m $(go list ./... | grep -vx glitched)

  # The race detector needs cgo on Linux; nothing else does.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -timeout 10m ./internal/client ./internal/daemon ./internal/transport
      # A step of its own: the plugins' runtimes, run beside the client's
      # timed tests, would starve them of the runner's CPU.
      - run: go test -race -timeout 10m ./internal/plugins/... ./internal/mcp
      # Verbose, so the log says whether this runner has the user systemd
      # manager these tests need, or skips them.
      - run: go test -race -v -run 'MarkerBehind|WithoutScopes' ./internal/provider/claude
