name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # With cgo off, so vet also proves every package builds without it.
  vet:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go tool mygo vet .

  test:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 50
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # mygo lays out text with Pango, loaded at run time. Without it the
      # root package's UI tests click on a fallback layout and fail.
      - name: Install Pango
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpangocairo-1.0-0
      # Stopgap: the root package takes up to 20 minutes on a slow runner.
      # Bring this back to 20m once the suite is fast again (NEL-20).
      - run: go test -timeout 40m ./...

  # The race detector needs cgo on Linux; nothing else does.
  race:
    runs-on: [self-hosted, ferrum, garm]
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -timeout 10m ./internal/client ./internal/daemon ./internal/transport
      # A step of its own: the plugins' runtimes, run beside the client's
      # timed tests, would starve them of the runner's CPU.
      - run: go test -race -timeout 10m ./internal/plugins/... ./internal/mcp
      # Verbose, so the log says whether this runner has the user systemd
      # manager these tests need, or skips them.
      - run: go test -race -v -run 'MarkerBehind|WithoutScopes' ./internal/provider/claude
